name: Mantener activo el cron

on:
  schedule:
    - cron: "37 9 1 * *"
  workflow_dispatch:

concurrency:
  group: mantener-activo
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  registrar-actividad:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v7

      - name: Guardar y confirmar la fecha
        run: |
          date -u +%F > .github/actividad-mensual.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/actividad-mensual.txt
          if git diff --cached --quiet; then
            echo "La fecha ya está registrada."
          else
            git commit -m "chore: registrar actividad mensual"
            git push
          fi
