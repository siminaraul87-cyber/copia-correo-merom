name: Copiar correo a Gmail

on:
  schedule:
    - cron: "*/10 * * * *"
    # Una vez al día repasa TODO el buzón: completa lo que faltara (cortes,
    # límites de Gmail...) sin duplicar lo que ya está copiado.
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      dias:
        description: "Días que se revisarán (usa 3650 para la primera copia)"
        required: true
        default: 3
        type: number

# Las copias completas (diaria o manual con muchos días) van en su propio
# grupo para que las ejecuciones de cada 10 minutos no las cancelen.
concurrency:
  group: ${{ (inputs.dias > 3 || github.event.schedule == '17 3 * * *') && 'copiar-completa' || 'copiar-normal' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  copiar:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v7

      - name: Preparar Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Copiar mensajes
        env:
          ORIGEN_USUARIO: ${{ secrets.ORIGEN_USUARIO }}
          ORIGEN_PASSWORD: ${{ secrets.ORIGEN_PASSWORD }}
          GMAIL_USUARIO: ${{ secrets.GMAIL_USUARIO }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          DIAS: ${{ inputs.dias || (github.event.schedule == '17 3 * * *' && 3650) || 3 }}
        run: python copiar_correo.py --dias "$DIAS"
